name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Fails the check if a link is broken or a page is missing from the menu
      - run: mkdocs build --strict
      # Publish to GitHub Pages only when merged to main
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: mkdocs gh-deploy --force
